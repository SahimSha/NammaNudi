<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NammaNudi — Everyday Kannada Companion</title>
    <meta name="description" content="Learn it. Say it. Use it. A practical, offline-first mobile companion for non-Kannada speakers navigating daily life in Karnataka." />
    <meta name="theme-color" content="#0D5C58" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Kannada and Latin Web Fonts with native fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#FAF8F5] text-stone-900 antialiased selection:bg-teal-700 selection:text-white font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for Offline PWA Support
      if ('serviceWorker' in navigator && !window.location.hostname.includes('localhost.disabled')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('NammaNudi SW registered with scope: ', registration.scope);
            },
            (err) => {
              console.log('NammaNudi SW registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
